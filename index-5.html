<!DOCTYPE html>

<link rel="stylesheet" type="text/css" href="assets/css/index5.css">
<link rel="icon"  href="images/web.ico" type="image/ico">
<head>
	<title>Dowload</title>
	 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  	
import { createClient } from '@supabase/supabase-js'
const supabaseUrl = 'https://yobziyjjfofwrnwqwics.supabase.co'
const supabaseKey = process.env.SUPABASE_KEY
const supabase = createClient(supabaseUrl, supabaseKey)
  </script>
</head>
<body>
	<!--no hace falta
	<p class="title">books and  PDF</p>
-->
<div style=" height: auto; margin: auto;text-align: center;"> 
	
	<p  class="sub">
		<a href="index.html"><img src="img/volver.png" class="volver"></a>Libros</p>
		<h5>Da click para descargar pdf</h5>


		<div class="div1">
			 	<!-- Texto para descargar en nueva ventanatarget="_blank" download="" -->

			<div class="contenido"><img src="img/folder.ico"><a href="pdf/71044829.pdf"  ><p class="texto">Witold Gombrowicz. 
			La leccion del diario </p></a></div>


			<div class="contenido"><img src="img/folder.ico"><a href="pdf/376-Texto del artículo-734-1-10-20150608.pdf"><p class="texto">Reflexiones acerca de la sociología
			ante el nuevo siglo</p></a></div> 


			

			
			
			
		</div>
		<input type="file" id="pdfInput" accept=".pdf">
			<button onclick="subirPDF()">Subir PDF</button>

			<div id="pdfList">
			  <!-- PDFs aparecerán aquí -->
			</div>
		<div class="div2">
			Copyright &copy;All rights reserved JJV
		</div>

	</div>


	<script type="text/javascript">
		// Subir PDF
async function subirPDF() {
  const file = document.getElementById('pdfInput').files[0];
  if (!file) return alert('Selecciona un PDF');

  const { data, error } = await supabase.storage
    .from('pdfs')
    .upload(`documento_${Date.now()}.pdf`, file);

  if (error) {
    console.error('Error al subir:', error);
  } else {
    alert('PDF subido con éxito!');
    listarPDFs();
  }
}

// Listar PDFs
async function listarPDFs() {
  const { data, error } = await supabase.storage
    .from('pdfs')
    .list();

  if (error) {
    console.error('Error al listar:', error);
    return;
  }

  let html = '<h3>Tus PDFs:</h3><ul>';
  data.forEach(file => {
    const url = supabase.storage
      .from('pdfs')
      .getPublicUrl(file.name);

    html += `
      <li>
        <a href="${url.data.publicUrl}" target="_blank">${file.name}</a>
        <button onclick="descargarPDF('${file.name}')">⬇️</button>
      </li>
    `;
  });

  document.getElementById('pdfList').innerHTML = html + '</ul>';
}

// Descargar PDF
function descargarPDF(filename) {
  const { data } = supabase.storage
    .from('pdfs')
    .getPublicUrl(filename);

  window.open(data.publicUrl, '_blank');
}

// Inicializar lista al cargar
document.addEventListener('DOMContentLoaded', listarPDFs);
	</script>
</body>
</html>
