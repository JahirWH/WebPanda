<!DOCTYPE html>
<html>

	<link rel="stylesheet" type="text/css" href="assets/css/Login.css">

</head>
<body>
	<div class="volver"><a href="index.html"><img src="img/globo.ico"></a></div>
	<div class="login">
	<img class="avatar" src="img/nasa.png" alt="logo de naz">
	<h1>Login here</h1>
		<form name="Login">
			<!--unarname.-->
			<label for="username">Username</label>

			<label for="password">Password</label>
			<input  name="contraseña" type="password" id="contraseña"  placeholder="Escribe password">
			<!-- BTN -->
			<input  onclick="login()" type="submit" value="Ingresar">

			<a href="#">Create nueva cuenta</a>
		</form> 
	</div>
