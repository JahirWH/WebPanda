<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" type="text/css" href="style_login.css">
	<meta charset="utf-8">
	<title>Chatzing</title>
	<meta charset="utf-8">
</head>
<body>

	<nav>
		<h1>Welcome Doing Chat</h1>
	</nav>
	<form>
		<h3><p>Create New Count</p></h3>
		<div class="names">
			<label>First Name
				<input class="input" required="" id="Name" type="text" name="name" placeholder="Enter your name">
			</label>
			<label>Last Name
				<input class="input" required="" id="last_name" type="text" name="last_name" placeholder="Enter your last name">
			</label>
		</div>
		<div class="email_password">
			<label>Email
				<input class="input" required="" id="email" type="Email" name="email" placeholder="Enter your email">
			</label>
			<label>Password
			<input class="input" required="" minlength="8" id="Password" type="Password" name="password" placeholder="Enter your new password">
			</label>
			
			<input class="input" required="" minlength="8" id="Password_confirm" type="Password" name="password" placeholder="Confirm your new password">
			<p class="sub_text">(the password requires at least 8 characters)</p>
			<button  class="btn">Login</button>
		</div>

	</form>
</body>
</html>
